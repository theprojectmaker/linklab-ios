name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the build to TestFlight"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Typecheck
        run: npx tsc --noEmit

      - name: EAS build (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p ios --profile production --local --non-interactive --output ${{ runner.temp }}/app.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ${{ runner.temp }}/app.ipa

      - name: EAS submit
        if: ${{ inputs.submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit -p ios --path ${{ runner.temp }}/app.ipa --non-interactive --wait
